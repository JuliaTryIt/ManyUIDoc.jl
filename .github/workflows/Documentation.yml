name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Configure Git for dependencies
        run: |
          if [ -n "${{ secrets.MANYUI_READ_TOKEN }}" ]; then
            git config --global url."https://x-access-token:${{ secrets.MANYUI_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
          fi
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop([
              PackageSpec(url="https://github.com/s-celles/ManyUI.jl.git"),
              PackageSpec(url="https://github.com/s-celles/ManyUITUI.jl.git")
          ])
          Pkg.instantiate()
      - name: Build documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs --color=yes -e 'include("docs/make.jl")'
