name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        env:
          MANYUI_READ_TOKEN: ${{ secrets.MANYUI_READ_TOKEN }}
        run: |
          using Pkg
          token = get(ENV, "MANYUI_READ_TOKEN", "")
          auth = isempty(token) ? "" : "$token@"
          Pkg.develop([
              PackageSpec(url="https://$(auth)github.com/s-celles/ManyUI.jl.git"),
              PackageSpec(url="https://$(auth)github.com/s-celles/ManyUITUI.jl.git")
          ])
          Pkg.instantiate()
      - name: Build documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs --color=yes -e 'include("docs/make.jl")'
